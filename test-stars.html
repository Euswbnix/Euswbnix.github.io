<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>代码渲染：璀璨星空</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const starGeometry = new THREE.BufferGeometry();
        const starCount = 15000;
        const positions = new Float32Array(starCount * 3);
        const colors = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount * 3; i += 3) {
            const r = 400 + Math.random() * 100;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            positions[i] = r * Math.sin(phi) * Math.cos(theta);
            positions[i+1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i+2] = r * Math.cos(phi);

            colors[i] = 0.7 + Math.random() * 0.3;
            colors[i+1] = 0.8 + Math.random() * 0.2;
            colors[i+2] = 1.0;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const starMaterial = new THREE.PointsMaterial({
            size: 0.8,
            vertexColors: true,
            transparent: true,
            opacity: 0.8
        });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        const galaxyGeo = new THREE.SphereGeometry(380, 64, 64);
        const galaxyMat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            transparent: true,
            uniforms: { time: { value: 0 } },
            vertexShader: `
                varying vec2 vUv;
                void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
            `,
            fragmentShader: `
                varying vec2 vUv;
                void main() {
                    float dist = distance(vUv.x, 0.5);
                    float strength = exp(-pow(dist * 8.0, 2.0));
                    vec3 color = vec3(0.05, 0.1, 0.4) * strength;
                    color += vec3(0.6, 0.4, 0.8) * exp(-pow(distance(vUv, vec2(0.5, 0.6)) * 10.0, 2.0));
                    gl_FragColor = vec4(color, strength * 0.6);
                }
            `
        });
        const galaxy = new THREE.Mesh(galaxyGeo, galaxyMat);
        scene.add(galaxy);

        const mountainGeo = new THREE.PlaneGeometry(200, 60);
        const mountainMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const mountain = new THREE.Mesh(mountainGeo, mountainMat);
        mountain.position.z = -20;
        mountain.position.y = -25;
        scene.add(mountain);

        const renderPass = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 1.2;
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderPass);
        composer.addPass(bloomPass);

        camera.position.z = 1;

        function animate() {
            requestAnimationFrame(animate);
            stars.rotation.y += 0.0003;
            galaxy.rotation.y += 0.0001;
            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
